# Copied straight to /etc/nginx/conf.d/default.conf. NOT a *.template, and that
# is deliberate: the image's entrypoint runs envsubst over anything in
# /etc/nginx/templates, and envsubst cannot tell nginx's own $uri from a shell
# variable. That mechanism existed here only to inject an Emby upstream, and it
# is what broke the container -- a `resolver ${NGINX_LOCAL_RESOLVERS}` whose
# variable nobody ever set, left verbatim in the config, killing nginx at
# startup whether or not the proxy was in use. Nothing left to substitute, so
# nothing substitutes.
#
# LinWeb serves static files and nothing else. It does NOT reverse-proxy Emby:
# put LinWeb and Emby behind your own nginx / Caddy if you want them same-origin
# (DEPLOY.md, "方式 D").

server {
    # Fixed on purpose. Remap with `-p 8080:23685` -- that is what publishing is
    # for, and a port that only ever moves outside the container keeps this file
    # and the healthcheck from drifting apart.
    listen      23685;
    listen      [::]:23685;
    server_name _;
    root        /usr/share/nginx/html;

    # Nothing in this build carries a content hash, so caching it hard means
    # users keep running last week's JavaScript. `no-cache` still stores the
    # file -- it only forces revalidation, and a 304 on the 32 MB wasm costs one
    # round trip instead of 32 MB.
    add_header Cache-Control "no-cache" always;

    # Text only. The wasm blobs are already dense, and compressing 32 MB on
    # every request costs more CPU than the LAN this usually runs on would
    # ever notice.
    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
